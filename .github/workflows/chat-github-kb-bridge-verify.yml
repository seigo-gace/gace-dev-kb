name: CHAT GitHub KB Bridge Verify

on:
  pull_request:
  push:
    branches:
      - feat/chat-github-kb-bridge-20261006

permissions:
  contents: read

jobs:
  source-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Python syntax and unit gates
        run: |
          python -m py_compile scripts/gace_kb_chat_bridge.py scripts/tgserver_zero_kb_log.py tests/test_gace_kb_chat_bridge.py tests/test_tgserver_zero_kb_log.py .gace-control/command-validation/p014-gateway-client-probe.py
          python -B tests/test_gace_kb_chat_bridge.py
          python -B tests/test_tgserver_zero_kb_log.py

      - name: PowerShell parser gates
        shell: pwsh
        run: |
          $files = @(
            'scripts/process-gace-kb-chat-github-bridge-windows.ps1',
            'scripts/watch-gace-kb-chat-github-bridge-windows.ps1',
            'scripts/configure-gace-kb-chat-github-bridge-task-windows.ps1',
            '.gace-control/command-validation/master-pc-chat-kb-bridge-e2e.ps1',
            '.gace-control/command-validation/master-pc-p014-diagnostic-reflect.ps1',
            '.gace-control/command-validation/master-pc-p014-diagnostic-reflect-invoke.ps1',
            '.gace-control/command-validation/master-pc-p014-diagnostic-reflect-launcher.ps1',
            '.gace-control/command-validation/master-pc-p014-request-readback.ps1',
            '.gace-control/command-validation/master-pc-p014-request-readback-invoke.ps1',
            '.gace-control/command-validation/master-pc-p014-gateway-client-probe.ps1',
            '.gace-control/command-validation/master-pc-p014-gateway-client-probe-launcher.ps1',
            'tests/test_chat_bridge_path_filters.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$file :: $($_.Message)" }
              throw "CHAT_BRIDGE_POWERSHELL_PARSE_FAILED=$file"
            }
            Write-Host "GACE_KB_CHAT_BRIDGE_PARSE=PASS OS=LINUX FILE=$file"
          }

      - name: GitHub path filter regression
        shell: pwsh
        run: |
          ./tests/test_chat_bridge_path_filters.ps1

  windows-gates:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Python unit gates
        shell: powershell
        run: |
          python -B tests/test_gace_kb_chat_bridge.py
          if ($LASTEXITCODE -ne 0) { throw "CHAT_BRIDGE_WINDOWS_PYTHON_FAILED=$LASTEXITCODE" }
          python -B tests/test_tgserver_zero_kb_log.py
          if ($LASTEXITCODE -ne 0) { throw "TGSERVER_ZERO_KB_LOG_WINDOWS_PYTHON_FAILED=$LASTEXITCODE" }

      - name: Windows PowerShell parser gates
        shell: powershell
        run: |
          $files = @(
            'scripts\process-gace-kb-chat-github-bridge-windows.ps1',
            'scripts\watch-gace-kb-chat-github-bridge-windows.ps1',
            'scripts\configure-gace-kb-chat-github-bridge-task-windows.ps1',
            '.gace-control\command-validation\master-pc-chat-kb-bridge-e2e.ps1',
            '.gace-control\command-validation\master-pc-p014-diagnostic-reflect.ps1',
            '.gace-control\command-validation\master-pc-p014-diagnostic-reflect-invoke.ps1',
            '.gace-control\command-validation\master-pc-p014-diagnostic-reflect-launcher.ps1',
            '.gace-control\command-validation\master-pc-p014-request-readback.ps1',
            '.gace-control\command-validation\master-pc-p014-request-readback-invoke.ps1',
            '.gace-control\command-validation\master-pc-p014-gateway-client-probe.ps1',
            '.gace-control\command-validation\master-pc-p014-gateway-client-probe-launcher.ps1',
            'tests\test_chat_bridge_path_filters.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$file :: $($_.Message)" }
              throw "CHAT_BRIDGE_WINDOWS_POWERSHELL_PARSE_FAILED=$file"
            }
            Write-Host "GACE_KB_CHAT_BRIDGE_PARSE=PASS OS=WINDOWS FILE=$file"
          }

      - name: Windows GitHub path filter regression
        shell: powershell
        run: |
          .\\tests\\test_chat_bridge_path_filters.ps1

      - name: Windows probe UTF-8 materialization regression
        shell: powershell
        run: |
          $spec='HEAD:.gace-control/command-validation/p014-gateway-client-probe.py'
          $tmp=Join-Path $env:TEMP 'p014-gateway-client-probe-ci.py'
          $source=@(& git show $spec)
          if($LASTEXITCODE -ne 0){throw 'PROBE_SOURCE_READ_FAILED'}
          Set-Content -Path $tmp -Value $source -Encoding UTF8
          python -m py_compile $tmp
          if($LASTEXITCODE -ne 0){throw 'PROBE_UTF8_MATERIALIZATION_FAILED'}
          Remove-Item $tmp -Force -ErrorAction SilentlyContinue
          Write-Host 'P014_PROBE_UTF8_MATERIALIZATION=PASS'

