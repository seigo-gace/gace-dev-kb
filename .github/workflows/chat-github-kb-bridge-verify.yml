name: CHAT GitHub KB Bridge Verify

on:
  pull_request:
  push:
    branches:
      - feat/chat-github-kb-bridge-20261006

permissions:
  contents: read

jobs:
  source-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Python syntax and unit gates
        run: |
          python -m py_compile scripts/gace_kb_chat_bridge.py tests/test_gace_kb_chat_bridge.py
          python -B tests/test_gace_kb_chat_bridge.py

      - name: PowerShell parser gates
        shell: pwsh
        run: |
          $files = @(
            'scripts/process-gace-kb-chat-github-bridge-windows.ps1',
            'scripts/watch-gace-kb-chat-github-bridge-windows.ps1',
            'scripts/configure-gace-kb-chat-github-bridge-task-windows.ps1',
            '.gace-control/command-validation/master-pc-chat-kb-bridge-e2e.ps1',
            'tests/test_chat_bridge_path_filters.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$file :: $($_.Message)" }
              throw "CHAT_BRIDGE_POWERSHELL_PARSE_FAILED=$file"
            }
            Write-Host "GACE_KB_CHAT_BRIDGE_PARSE=PASS OS=LINUX FILE=$file"
          }

      - name: GitHub path filter regression
        shell: pwsh
        run: |
          ./tests/test_chat_bridge_path_filters.ps1

  windows-gates:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Python unit gates
        shell: powershell
        run: |
          python -B tests/test_gace_kb_chat_bridge.py
          if ($LASTEXITCODE -ne 0) { throw "CHAT_BRIDGE_WINDOWS_PYTHON_FAILED=$LASTEXITCODE" }

      - name: Windows PowerShell parser gates
        shell: powershell
        run: |
          $files = @(
            'scripts\process-gace-kb-chat-github-bridge-windows.ps1',
            'scripts\watch-gace-kb-chat-github-bridge-windows.ps1',
            'scripts\configure-gace-kb-chat-github-bridge-task-windows.ps1',
            '.gace-control\command-validation\master-pc-chat-kb-bridge-e2e.ps1',
            'tests\test_chat_bridge_path_filters.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$file :: $($_.Message)" }
              throw "CHAT_BRIDGE_WINDOWS_POWERSHELL_PARSE_FAILED=$file"
            }
            Write-Host "GACE_KB_CHAT_BRIDGE_PARSE=PASS OS=WINDOWS FILE=$file"
          }

      - name: Windows GitHub path filter regression
        shell: powershell
        run: |
          .\\tests\\test_chat_bridge_path_filters.ps1
