name: Reusable Asset KB Verify

on:
  pull_request:
  push:
    branches:
      - feat/reusable-asset-kb-schema-20261001

permissions:
  contents: read

jobs:
  reusable-asset-kb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Python syntax gates
        run: |
          python -m py_compile \
            scripts/import_modulecatalog_reusable_export.py \
            scripts/import_reusable_asset_bundle.py \
            scripts/replace_modulecatalog_reusable_snapshot.py \
            tests/mcp_reusable_asset_e2e.py

      - name: Node syntax gate
        run: node --check scripts/run_modulecatalog_reusable_export.mjs

      - name: PowerShell syntax gates
        shell: pwsh
        run: |
          $files = @(
            'scripts/test-modulecatalog-reusable-export-windows.ps1',
            'scripts/promote-modulecatalog-reusable-export-to-formal-kb-windows.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$file :: $($_.Message)" }
              throw "POWERSHELL_PARSE_FAILED=$file"
            }
            Write-Host "POWERSHELL_PARSE=PASS FILE=$file"
          }

      - name: Reusable export importer fixture tests
        run: python -B tests/test_import_modulecatalog_reusable_export.py

      - name: Reusable active snapshot replacement tests
        run: python -B tests/test_replace_modulecatalog_reusable_snapshot.py

      - name: Generic reusable bundle compatibility tests
        run: python -B tests/test_import_reusable_asset_bundle.py

      - name: Existing knowledge regression tests
        run: |
          python -B tests/test_combine_knowledge_records.py
          python -B tests/test_render_knowledge_corpus.py
          python -B tests/test_gace_knowledge_adapter.py
          python -B tests/test_import_verified_modulecatalog_skills.py

      - name: Real ModuleCatalog 80-asset producer-consumer contract
        env:
          MODULECATALOG_COMMIT: f83461b79344e18dda145978fec5cb8f62896ad1
        run: |
          set -euo pipefail
          git clone https://github.com/seigo-gace/modular-catalog.git /tmp/modular-catalog
          git -C /tmp/modular-catalog checkout --detach "$MODULECATALOG_COMMIT"
          node scripts/run_modulecatalog_reusable_export.mjs \
            --catalog-root /tmp/modular-catalog \
            --output-root /tmp/modulecatalog-export \
            --catalog-commit "$MODULECATALOG_COMMIT" \
            --expected-asset-count 80
          python -B scripts/import_modulecatalog_reusable_export.py \
            --export-root /tmp/modulecatalog-export \
            --output-root /tmp/gace-reusable-import \
            --expected-catalog-commit "$MODULECATALOG_COMMIT" \
            --expected-asset-count 80 \
            --expected-record-count 720
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/gace-reusable-import')
          metadata = [json.loads(line) for line in (root / 'knowledge-metadata.jsonl').read_text().splitlines() if line.strip()]
          records = [line for line in (root / 'knowledge-records.jsonl').read_text().splitlines() if line.strip()]
          corpus = list((root / 'records').glob('*.md'))
          assert len(metadata) == 720, len(metadata)
          assert len(records) == 720, len(records)
          assert len(corpus) == 720, len(corpus)
          assert len({row['parent_asset_id'] for row in metadata}) == 80
          kinds = {row['knowledge_kind'] for row in metadata}
          required = {'discovery','documentation','design','logic','architecture','evidence','code','test_case'}
          assert required <= kinds, sorted(kinds)
          assert all(row['verification']['status'] == 'verified' for row in metadata)
          assert all(row['_gace']['commit'] == 'f83461b79344e18dda145978fec5cb8f62896ad1' for row in metadata)
          print(f'REAL_MODULECATALOG_CONTRACT=PASS ASSETS=80 RECORDS=720 KINDS={len(kinds)}')
          PY
